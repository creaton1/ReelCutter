name: Build ReelCutter

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # ручной запуск из UI

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # стабильная версия с колесами
          cache: 'pip'

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v2
        with:
          version: 'latest'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Vosk models
        run: |
          $modelsDir = "reelcutter\models\vosk"
          New-Item -ItemType Directory -Force -Path $modelsDir | Out-Null

          # Russian
          if (-not (Test-Path "$modelsDir\vosk-model-small-ru-0.22")) {
            Write-Host "Downloading Vosk RU..."
            Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip" -OutFile "vosk-ru.zip"
            Expand-Archive -Path "vosk-ru.zip" -DestinationPath $modelsDir -Force
            Remove-Item "vosk-ru.zip"
          }

          # English
          if (-not (Test-Path "$modelsDir\vosk-model-small-en-us-0.15")) {
            Write-Host "Downloading Vosk EN..."
            Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" -OutFile "vosk-en.zip"
            Expand-Archive -Path "vosk-en.zip" -DestinationPath $modelsDir -Force
            Remove-Item "vosk-en.zip"
          }

      - name: Create icon
        run: python create_icon.py

      - name: Build with PyInstaller
        run: python -m PyInstaller reelcutter.spec --clean --noconfirm

      - name: Verify exe
        run: |
          $exe = "dist\ReelCutter.exe"
          if (Test-Path $exe) {
            Write-Host "✅ EXE built: $exe"
            $size = (Get-Item $exe).Length / 1MB
            Write-Host "Size: $('{0:N1}' -f $size) MB"
          } else {
            Write-Host "❌ EXE not found!"
            Get-ChildItem dist -Recurse
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReelCutter-windows
          path: dist/ReelCutter.exe
          retention-days: 30
          compression-level: 6

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ReelCutter.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}